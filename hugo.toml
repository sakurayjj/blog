baseURL = 'https://www.ctfhub.cn/'
languageCode = 'zh-cn'
defaultContentLanguage = 'zh-cn'
title = '扬名立万_ymlw'
theme = 'shoka'
# 👇 【添加这一行】备案号配置
# 注意：这会覆盖默认的 "© 2025 扬名立万_ymlw" 显示，所以我们需要手动把版权声明也写在这里
copyright = "© 2025 扬名立万_ymlw &nbsp; <a href='https://beian.miit.gov.cn/' target='_blank'>苏ICP备2024061653号-1</a>"

enableRobotsTXT = true
buildDrafts = false
buildFuture = true
buildExpired = false

[languages]
  [languages.zh-cn]
    languageName = "Simplified Chinese"
    weight = 1

# 【新增】开启 JSON 输出，用于支持搜索
[outputs]
home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  title = "我的博客"
  description = "网安 & 取证的学习笔记"
  keywords = ["网络安全", "取证", "学习笔记", "博客"]
  images = ["/images/avatar.jpg"]
  author = "扬名立万"
  DateFormat = "2006-01-02"
  defaultTheme = "auto" 
  disableThemeToggle = false

  # 【新增】搜索优化配置
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 2
    keys = ["title", "permalink", "summary", "content"]

  # 1. Profile Mode (已关闭)
  [params.profileMode]
    enabled = false
    title = "欢迎来到我的博客"
    subtitle = "这里记录我的学习与生活"

  # 2. Home-Info Mode (已启用)
  [params.homeInfoParams]
    Title = "你知道的越多，你不知道的越多。"
    Content = """
欢迎来到我的博客。

这里主要用来记录我在学习与项目实践中的思考、踩坑与总结。

**欢迎交流与指正** 。
"""

  # 3. 社交图标
  [[params.socialIcons]]
    name = "Github"
    url = "https://github.com/yourname"

  [[params.socialIcons]]
    name = "Twitter"
    url = "https://twitter.com/yourname"
    
  [[params.socialIcons]]
    name = "Bilibili"
    url = "https://bilibili.com/"

# 4. 菜单配置
[menu]
  [[menu.main]]
    identifier = "categories"
    name = "分类"
    url = "/categories/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 30
  # 【新增】搜索菜单
  [[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 40

# 确保这段代码在 hugo.toml 的最底部
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
